<div class="layout">
  <app-search-form (filtersChanged)="onFiltersChanged($event)" />

  <div class="content-area">
    @if (error()) {
    <div class="search-error-banner" role="alert">
      <span class="error-icon">⚠️</span>
      <span>{{ error() }}</span>
    </div>
    }

    @if (isSearchActive()) {
    <app-hotel-list [searchResults]="searchResults()" [activeFilters]="lastFilters()" />
    } @else {
    <app-hotel-list [hotels]="hotels()" [activeFilters]="lastFilters()" />
    }
  </div>
</div>
