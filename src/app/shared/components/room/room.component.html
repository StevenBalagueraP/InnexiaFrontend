<div class="card" [class.card--booking]="variant() === 'hotel-booking'" [class.card--selected]="selected()">
  <div class="card-content">
    <h2 class="room-name">
      {{ room().type }}
    </h2>

    <div class="capacity-price-row">
      <div class="capacity">
        <mat-icon>group</mat-icon>
        <span class="capacity-text">
          Capacidad: {{ room().capacity }}
        </span>
      </div>

      @if (variant() === 'hotel-booking' && room().price != null) {
      <div class="price">
        {{ room().price | currency:'USD':'symbol':'1.0-0' }}
      </div>
      }
    </div>

    @if (room().description) {
    <p class="description">
      {{ room().description }}
    </p>
    }
  </div>

  @if (variant() === 'hotel-booking') {
  <button mat-stroked-button color="primary" class="book-btn" [class.book-btn--selected]="selected()" type="button"
    (click)="bookClicked.emit()">
    <mat-icon class="book-icon">
      {{ selected() ? 'radio_button_checked' : 'radio_button_unchecked' }}
    </mat-icon>
    {{ selected() ? 'Selected' : 'Book' }}
  </button>
  }
</div>
