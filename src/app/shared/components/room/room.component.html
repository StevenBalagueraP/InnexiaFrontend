<div class="card">
  <h2 class="room-name">
    {{ room().roomName }}
  </h2>

  <div class="capacity">
    <span class="icon">👥</span>
    <span class="capacity-text">
      Capacidad: {{ room().capacity }}
    </span>
  </div>

  @if (room().description) {
    <p class="description">
      {{ room().description }}
    </p>
  }
</div>
